<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financial Literacy Agent</title>

  <!-- MSAL -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

  <!-- WebChat (for UI shell, optional styling later) -->
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

  <style>
    body { margin: 0; font-family: Arial; background: #f4f6f9; }

    header {
      background: #1f3a5f;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    #loginBtn {
      margin: 20px auto;
      display: block;
      padding: 12px 20px;
      border: none;
      background: #0078d4;
      color: white;
      border-radius: 6px;
      font-size: 16px;
    }

    #userInfo {
      text-align: center;
      font-size: 12px;
      margin-bottom: 10px;
    }

    #chat {
      display: none;
      height: calc(100vh - 120px);
      margin: 10px;
      border-radius: 10px;
      overflow: hidden;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<header>Financial Literacy Assistant</header>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="userInfo"></div>

<div id="chat"></div>

<script>
  // ✅ CONFIG (fill these)
  const msalConfig = {
    auth: {
      clientId: "YOUR_CLIENT_ID",
      authority: "https://login.microsoftonline.com/YOUR_TENANT_ID",
      redirectUri: window.location.origin
    }
  };

  const msalInstance = new msal.PublicClientApplication(msalConfig);

  document.getElementById("loginBtn").onclick = async () => {
    try {
      const login = await msalInstance.loginPopup({
        scopes: ["User.Read"]
      });

      // ✅ UI updates
      document.getElementById("loginBtn").style.display = "none";
      document.getElementById("chat").style.display = "block";
      document.getElementById("userInfo").innerHTML =
        "Signed in: " + login.account.username;

      startAgent();

    } catch (err) {
      console.error(err);
      alert("Login failed");
    }
  };

  function startAgent() {

    // ✅ PLACEHOLDER: replace with Agents SDK connection
    // IMPORTANT → you will swap this section next

    const styleOptions = {
      bubbleBackground: "#e6f0ff",
      bubbleFromUserBackground: "#0078d4",
      bubbleFromUserTextColor: "white"
    };

    // TEMP mock WebChat (replace with real token later)
    window.WebChat.renderWebChat({
      directLine: window.WebChat.createDirectLine({
        secret: "YOUR_PLACEHOLDER_SECRET"
      }),
      styleOptions
    }, document.getElementById("chat"));
  }
</script>

</body>
</html>
