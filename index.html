<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financial Literacy Agent</title>

  <!-- MSAL -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

  <!-- WebChat -->
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f6f9;
    }

    header {
      background: #1f3a5f;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    #loginBtn {
      margin: 20px auto;
      display: block;
      padding: 12px 20px;
      border: none;
      background: #0078d4;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #chat {
      display: none;
      height: calc(100vh - 120px);
      margin: 10px;
      border-radius: 10px;
      background: white;
    }
  </style>
</head>

<body>

<header>Financial Literacy Assistant</header>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="chat"></div>

<script>
  // ✅ YOUR DATAVERSE BASE URL
  const DATAVERSE_BASE_URL = "https://org6c746ebe.api.crm.dynamics.com";

  const msalConfig = {
    auth: {
      clientId: "c9aff7e9-6c83-4122-8215-0b7c99a19804",
      authority: "https://login.microsoftonline.com/b0402c41-9027-486c-953f-d09da264a280",
      redirectUri: "https://qualityinformatics.github.io/financial-agent-web/"
    },
    cache: {
      cacheLocation: "localStorage",
      storeAuthStateInCookie: true
    }
  };

  const msalInstance = new msal.PublicClientApplication(msalConfig);

  // ✅ CORRECT TOKEN (DATAVERSE, NOT GRAPH)
  async function getAccessToken() {
    const account = msalInstance.getAllAccounts()[0];

    const result = await msalInstance.acquireTokenSilent({
      scopes: [`${DATAVERSE_BASE_URL}/.default`],
      account: account
    });

    return result.accessToken;
  }

  // ✅ CHAT CONNECTION (via Azure Function)
  async function startChat() {
    try {

      const tokenResponse = await fetch(
        "https://getcopilottoken-dteebkhxd3ahhdhw.centralus-01.azurewebsites.net/api/getCopilotToken",
        {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + await getAccessToken()
          }
        }
      );

      const data = await tokenResponse.json();

      const directLine = window.WebChat.createDirectLine({
        token: data.token
      });

      window.WebChat.renderWebChat({
        directLine: directLine
      }, document.getElementById("chat"));

    } catch (err) {
      console.error("CHAT ERROR:", err);
      alert("Chat failed");
    }
  }

  // ✅ LOGIN FLOW WITH CORRECT SCOPE
  document.getElementById("loginBtn").onclick = async () => {
    try {

      const login = await msalInstance.loginPopup({
        scopes: [
          "User.Read",
          `${DATAVERSE_BASE_URL}/user_impersonation`
        ]
      });

      document.getElementById("loginBtn").style.display = "none";
      document.getElementById("chat").style.display = "block";

      await startChat();

    } catch (err) {
      console.error("LOGIN ERROR:", err);
      alert("Login failed");
    }
  };
</script>

</body>
</html>
